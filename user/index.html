    /* Styling for the new order status UI */
    .order-status-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      color: white;
      font-family: 'Montserrat', sans-serif;
    }
    .order-status-box {
      background: white;
      color: #333;
      padding: 3rem;
      border-radius: 12px;
      text-align: center;
      max-width: 450px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .order-status-box .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    .order-status-box h2 {
      font-family: 'Playfair Display', serif;
      margin-bottom: 1rem;
    }
    .order-status-box .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0d5c45;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 1rem auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
